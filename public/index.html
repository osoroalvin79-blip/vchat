<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nearby &mdash; Quick Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1115;
    --panel: #171A21;
    --line: #262B36;
    --text: #F0F2F7;
    --text-dim: #8A93A6;
    --accent: #5FE3A1;
    --accent-dim: #1F3A2C;
    --me: #5B8CFF;
    --rec: #FF5C6C;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ---------- Join screen ---------- */
  #join-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .join-card { max-width: 380px; width: 100%; text-align: center; }
  .join-card .glyph {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 22px;
    background: linear-gradient(135deg, var(--accent), #2BB673);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .join-card h1 { font-size: 26px; margin: 0 0 8px; }
  .join-card p.sub { color: var(--text-dim); font-size: 14px; margin: 0 0 28px; }
  #nickname-input {
    width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 14px 16px; border-radius: 12px; font-size: 16px; font-family: inherit; margin-bottom: 14px;
  }
  #join-btn {
    width: 100%; background: var(--accent); color: #072316; border: none; font-weight: 700;
    padding: 14px; border-radius: 12px; font-size: 15px; cursor: pointer;
  }
  .join-error { color: #FF7A7A; font-size: 13px; margin-top: 12px; display: none; }

  /* ---------- Chat screen ---------- */
  #chat-screen { display: none; flex: 1; flex-direction: column; height: 100%; min-height: 0; }
  header.chat-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--panel); flex-shrink: 0;
  }
  header.chat-top .title { font-weight: 700; font-size: 15px; }
  .presence-pill {
    display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--accent); background: var(--accent-dim);
    padding: 5px 11px; border-radius: 999px;
  }
  .presence-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  #messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .msg-row { display: flex; flex-direction: column; max-width: 78%; }
  .msg-row.me { align-self: flex-end; align-items: flex-end; }
  .msg-row.system { align-self: center; max-width: 100%; }
  .msg-nick { font-size: 11.5px; color: var(--text-dim); margin-bottom: 3px; padding: 0 4px; }
  .msg-bubble {
    background: var(--panel); border: 1px solid var(--line); padding: 10px 14px;
    border-radius: 14px; font-size: 14.5px; line-height: 1.4; word-break: break-word;
  }
  .msg-row.me .msg-bubble { background: var(--me); border-color: var(--me); color: #fff; }
  .msg-row.system .msg-bubble {
    background: transparent; border: none; color: var(--text-dim); font-size: 12px;
    font-family: 'JetBrains Mono', monospace; text-align: center; padding: 4px;
  }
  .msg-time { font-size: 10px; color: var(--text-dim); margin-top: 3px; padding: 0 4px; }

  .msg-image { max-width: 240px; border-radius: 10px; display: block; margin-top: 2px; cursor: pointer; }
  .msg-file {
    display: flex; align-items: center; gap: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; text-decoration: none; color: var(--text);
  }
  .msg-row.me .msg-file { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); }
  .msg-file .fico { font-size: 20px; }
  .msg-file .fname { font-size: 13px; font-weight: 600; word-break: break-all; }
  .msg-file .fmeta { font-size: 11px; color: var(--text-dim); }
  .msg-audio audio { width: 220px; height: 38px; }

  /* Typing indicator: green pulsing dot */
  #typing-indicator {
    display: none; align-items: center; gap: 8px; padding: 6px 18px 0;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); flex-shrink: 0;
  }
  #typing-indicator .pulse-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
    animation: typingPulse 1.1s ease-in-out infinite;
  }
  @keyframes typingPulse {
    0% { transform: scale(0.6); opacity: 0.4; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0.6); opacity: 0.4; }
  }

  form#send-form {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line);
    background: var(--panel); flex-shrink: 0;
  }
  .icon-btn {
    background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer;
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--line); color: var(--text); }
  .icon-btn.recording { color: var(--rec); animation: recPulse 1s infinite; }
  @keyframes recPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  #message-input {
    flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 12px 16px; border-radius: 999px; font-size: 15px; font-family: inherit; min-width: 0;
  }
  #send-btn {
    background: var(--accent); color: #072316; border: none; width: 44px; height: 44px;
    border-radius: 50%; font-size: 17px; cursor: pointer; flex-shrink: 0;
  }
  #send-btn:disabled { opacity: 0.4; }

  .conn-banner {
    text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11.5px;
    color: #FFB454; background: #2B2013; padding: 6px; display: none; flex-shrink: 0;
  }
  .error-toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: #3D1A20; color: #FFB4BC; border: 1px solid #FF5C6C55; padding: 10px 18px;
    border-radius: 10px; font-size: 12.5px; display: none; z-index: 20;
  }

  /* Emoji picker */
  #emoji-panel {
    position: absolute; bottom: 68px; left: 14px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px; display: none; grid-template-columns: repeat(7, 1fr); gap: 4px;
    max-width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 15;
  }
  #emoji-panel button {
    background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; border-radius: 8px;
  }
  #emoji-panel button:hover { background: var(--line); }

  #chat-screen { position: relative; }

  /* Image lightbox */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  input[type="file"] { display: none; }
</style>
</head>
<body>

<div id="join-screen">
  <div class="join-card">
    <div class="glyph">&#128172;</div>
    <h1>Quick Chat</h1>
    <p class="sub">Pick a name and jump into the conversation. No account needed.</p>
    <input type="text" id="nickname-input" placeholder="Your name" maxlength="24" autocomplete="off">
    <button id="join-btn">Join Chat</button>
    <div class="join-error" id="join-error"></div>
  </div>
</div>

<div id="chat-screen">
  <div class="conn-banner" id="conn-banner">Reconnecting&hellip;</div>
  <header class="chat-top">
    <span class="title">Quick Chat</span>
    <div style="display:flex; align-items:center; gap:10px;">
      <a href="meeting.html" style="font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent); text-decoration:none; border:1px solid var(--accent-dim); padding:5px 11px; border-radius:999px;">&#127909; Start Meeting</a>
      <span class="presence-pill" id="presence-pill"><span class="dot"></span><span id="presence-count">0</span> online</span>
    </div>
  </header>

  <div id="messages"></div>

  <div id="typing-indicator"><span class="pulse-dot"></span><span id="typing-text"></span></div>

  <div id="emoji-panel"></div>
  <div class="error-toast" id="error-toast"></div>

  <form id="send-form">
    <button type="button" class="icon-btn" id="emoji-btn" title="Emoji">&#128512;</button>
    <button type="button" class="icon-btn" id="photo-btn" title="Photo">&#128247;</button>
    <button type="button" class="icon-btn" id="file-btn" title="File">&#128206;</button>
    <button type="button" class="icon-btn" id="voice-btn" title="Voice message">&#127908;</button>
    <input type="text" id="message-input" placeholder="Type a message&hellip;" maxlength="500" autocomplete="off">
    <button type="submit" id="send-btn">&#10148;</button>
    <input type="file" id="photo-input" accept="image/*">
    <input type="file" id="file-input">
  </form>
</div>

<div id="lightbox"><img id="lightbox-img" src="" alt=""></div>

<script>
  const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';

  const joinScreen = document.getElementById('join-screen');
  const chatScreen = document.getElementById('chat-screen');
  const nicknameInput = document.getElementById('nickname-input');
  const joinBtn = document.getElementById('join-btn');
  const joinError = document.getElementById('join-error');
  const messagesEl = document.getElementById('messages');
  const sendForm = document.getElementById('send-form');
  const messageInput = document.getElementById('message-input');
  const presenceCount = document.getElementById('presence-count');
  const connBanner = document.getElementById('conn-banner');
  const typingIndicator = document.getElementById('typing-indicator');
  const typingText = document.getElementById('typing-text');
  const emojiBtn = document.getElementById('emoji-btn');
  const emojiPanel = document.getElementById('emoji-panel');
  const photoBtn = document.getElementById('photo-btn');
  const photoInput = document.getElementById('photo-input');
  const fileBtn = document.getElementById('file-btn');
  const fileInput = document.getElementById('file-input');
  const voiceBtn = document.getElementById('voice-btn');
  const errorToast = document.getElementById('error-toast');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  let ws = null;
  let myNickname = null;
  let typingTimeout = null;
  let iAmTyping = false;
  const othersTyping = new Set();

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  function showError(msg) {
    errorToast.textContent = msg;
    errorToast.style.display = 'block';
    setTimeout(() => (errorToast.style.display = 'none'), 3500);
  }
  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // ---------- Rendering ----------
  function renderMessage(msg) {
    const row = document.createElement('div');
    if (msg.system) {
      row.className = 'msg-row system';
      row.innerHTML = `<div class="msg-bubble">${escapeHtml(msg.text)}</div>`;
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return;
    }

    const isMe = msg.nickname === myNickname;
    row.className = 'msg-row' + (isMe ? ' me' : '');

    let mediaHtml = '';
    if (msg.mediaType === 'image') {
      mediaHtml = `<img class="msg-image" src="${msg.mediaData}" alt="photo">`;
    } else if (msg.mediaType === 'audio') {
      mediaHtml = `<div class="msg-audio"><audio controls src="${msg.mediaData}"></audio></div>`;
    } else if (msg.mediaType === 'file') {
      mediaHtml = `
        <a class="msg-file" href="${msg.mediaData}" download="${escapeHtml(msg.mediaName)}">
          <span class="fico">&#128196;</span>
          <span>
            <div class="fname">${escapeHtml(msg.mediaName)}</div>
            <div class="fmeta">Tap to download</div>
          </span>
        </a>`;
    }

    const textHtml = msg.text ? `<div class="msg-bubble">${escapeHtml(msg.text)}</div>` : '';

    row.innerHTML = `
      ${isMe ? '' : `<div class="msg-nick">${escapeHtml(msg.nickname)}</div>`}
      ${mediaHtml}
      ${textHtml}
      <div class="msg-time">${formatTime(msg.timestamp)}</div>
    `;
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    row.querySelectorAll('.msg-image').forEach((img) => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.style.display = 'flex';
      });
    });
  }

  lightbox.addEventListener('click', () => (lightbox.style.display = 'none'));

  function updateTypingIndicator() {
    const names = [...othersTyping];
    if (names.length === 0) {
      typingIndicator.style.display = 'none';
    } else if (names.length === 1) {
      typingText.textContent = `${names[0]} is typing`;
      typingIndicator.style.display = 'flex';
    } else {
      typingText.textContent = `${names.length} people are typing`;
      typingIndicator.style.display = 'flex';
    }
  }

  // ---------- Connection ----------
  function connect(nickname) {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      connBanner.style.display = 'none';
      ws.send(JSON.stringify({ type: 'join', nickname }));
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'history') {
        messagesEl.innerHTML = '';
        data.messages.forEach(renderMessage);
      } else if (data.type === 'message') {
        renderMessage(data);
      } else if (data.type === 'presence') {
        presenceCount.textContent = data.count;
      } else if (data.type === 'typing') {
        othersTyping.add(data.nickname);
        updateTypingIndicator();
      } else if (data.type === 'stop_typing') {
        othersTyping.delete(data.nickname);
        updateTypingIndicator();
      } else if (data.type === 'error') {
        showError(data.message);
      }
    };

    ws.onclose = () => {
      connBanner.style.display = 'block';
      setTimeout(() => connect(nickname), 2000);
    };
    ws.onerror = () => ws.close();
  }

  function wsSend(payload) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
  }

  // ---------- Join ----------
  joinBtn.addEventListener('click', () => {
    const nickname = nicknameInput.value.trim();
    if (!nickname) {
      joinError.style.display = 'block';
      joinError.textContent = 'Please enter a name.';
      return;
    }
    myNickname = nickname;
    joinScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    connect(nickname);
  });
  nicknameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });

  // ---------- Sending text ----------
  sendForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text) return;
    wsSend({ type: 'chat', text });
    messageInput.value = '';
    stopTyping();
  });

  // ---------- Typing indicator (outgoing) ----------
  function startTyping() {
    if (!iAmTyping) {
      iAmTyping = true;
      wsSend({ type: 'typing' });
    }
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(stopTyping, 2500);
  }
  function stopTyping() {
    if (iAmTyping) {
      iAmTyping = false;
      wsSend({ type: 'stop_typing' });
    }
    clearTimeout(typingTimeout);
  }
  messageInput.addEventListener('input', () => {
    if (messageInput.value.length > 0) startTyping();
    else stopTyping();
  });

  // ---------- Emoji picker ----------
  const EMOJIS = ['😀','😂','😍','😊','😎','🥳','😢','😮','😡','👍','👎','🙏','👏','🔥','🎉','❤️','💯','✨','🤔','😴','👋','🙌','💀','😭','🤝','⭐','✅','❌'];
  EMOJIS.forEach((e) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = e;
    b.addEventListener('click', () => {
      messageInput.value += e;
      messageInput.focus();
      startTyping();
    });
    emojiPanel.appendChild(b);
  });
  emojiBtn.addEventListener('click', () => {
    emojiPanel.style.display = emojiPanel.style.display === 'grid' ? 'none' : 'grid';
  });
  document.addEventListener('click', (e) => {
    if (!emojiPanel.contains(e.target) && e.target !== emojiBtn) emojiPanel.style.display = 'none';
  });

  // ---------- Photo upload (compressed client-side) ----------
  photoBtn.addEventListener('click', () => photoInput.click());
  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (!file) return;
    compressImage(file, (dataUrl) => {
      wsSend({ type: 'chat', text: '', mediaType: 'image', mediaData: dataUrl, mediaName: file.name, mediaMime: 'image/jpeg' });
    });
    photoInput.value = '';
  });

  function compressImage(file, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1280;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------- File upload ----------
  const MAX_FILE_BYTES = 6 * 1024 * 1024;
  fileBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    if (file.size > MAX_FILE_BYTES) {
      showError('That file is too large (max ~6MB).');
      fileInput.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      wsSend({ type: 'chat', text: '', mediaType: 'file', mediaData: e.target.result, mediaName: file.name, mediaMime: file.type });
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  // ---------- Voice recording ----------
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  voiceBtn.addEventListener('click', async () => {
    if (!isRecording) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError('Voice recording is not supported on this browser.');
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          if (blob.size > MAX_FILE_BYTES) {
            showError('That recording is too long (max ~6MB).');
            return;
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            wsSend({ type: 'chat', text: '', mediaType: 'audio', mediaData: e.target.result, mediaName: 'voice-message.webm', mediaMime: 'audio/webm' });
          };
          reader.readAsDataURL(blob);
          stream.getTracks().forEach((t) => t.stop());
        };
        mediaRecorder.start();
        isRecording = true;
        voiceBtn.classList.add('recording');
        voiceBtn.innerHTML = '&#9209;&#65039;';
      } catch (err) {
        showError('Microphone access was denied or unavailable.');
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      voiceBtn.classList.remove('recording');
      voiceBtn.innerHTML = '&#127908;';
    }
  });
</script>

</body>
</html>
