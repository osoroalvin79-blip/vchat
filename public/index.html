<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nearby &mdash; Quick Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1115;
    --panel: #171A21;
    --line: #262B36;
    --text: #F0F2F7;
    --text-dim: #8A93A6;
    --accent: #5FE3A1;
    --accent-dim: #1F3A2C;
    --me: #5B8CFF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ---------- Join screen ---------- */
  #join-screen {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .join-card { max-width: 380px; width: 100%; text-align: center; }
  .join-card .glyph {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 22px;
    background: linear-gradient(135deg, var(--accent), #2BB673);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .join-card h1 { font-size: 26px; margin: 0 0 8px; }
  .join-card p.sub { color: var(--text-dim); font-size: 14px; margin: 0 0 28px; }
  #nickname-input {
    width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 14px 16px; border-radius: 12px; font-size: 16px; font-family: inherit; margin-bottom: 14px;
  }
  #join-btn {
    width: 100%; background: var(--accent); color: #072316; border: none; font-weight: 700;
    padding: 14px; border-radius: 12px; font-size: 15px; cursor: pointer;
  }
  #join-btn:disabled { opacity: 0.5; }
  .join-error { color: #FF7A7A; font-size: 13px; margin-top: 12px; display: none; }

  /* ---------- Chat screen ---------- */
  #chat-screen { display: none; flex: 1; flex-direction: column; height: 100%; }
  header.chat-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header.chat-top .title { font-weight: 700; font-size: 15px; }
  .presence-pill {
    display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--accent); background: var(--accent-dim);
    padding: 5px 11px; border-radius: 999px;
  }
  .presence-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  #messages {
    flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg-row { display: flex; flex-direction: column; max-width: 78%; }
  .msg-row.me { align-self: flex-end; align-items: flex-end; }
  .msg-row.system { align-self: center; max-width: 100%; }
  .msg-nick { font-size: 11.5px; color: var(--text-dim); margin-bottom: 3px; padding: 0 4px; }
  .msg-bubble {
    background: var(--panel); border: 1px solid var(--line); padding: 10px 14px;
    border-radius: 14px; font-size: 14.5px; line-height: 1.4; word-break: break-word;
  }
  .msg-row.me .msg-bubble { background: var(--me); border-color: var(--me); color: #fff; }
  .msg-row.system .msg-bubble {
    background: transparent; border: none; color: var(--text-dim); font-size: 12px;
    font-family: 'JetBrains Mono', monospace; text-align: center; padding: 4px;
  }
  .msg-time { font-size: 10px; color: var(--text-dim); margin-top: 3px; padding: 0 4px; }

  form#send-form {
    display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--line); background: var(--panel);
  }
  #message-input {
    flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 12px 16px; border-radius: 999px; font-size: 15px; font-family: inherit;
  }
  #send-btn {
    background: var(--accent); color: #072316; border: none; width: 46px; height: 46px;
    border-radius: 50%; font-size: 18px; cursor: pointer; flex-shrink: 0;
  }
  #send-btn:disabled { opacity: 0.4; }

  .conn-banner {
    text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11.5px;
    color: #FFB454; background: #2B2013; padding: 6px; display: none;
  }
</style>
</head>
<body>

<div id="join-screen">
  <div class="join-card">
    <div class="glyph">&#128172;</div>
    <h1>Quick Chat</h1>
    <p class="sub">Pick a name and jump into the conversation. No account needed.</p>
    <input type="text" id="nickname-input" placeholder="Your name" maxlength="24" autocomplete="off">
    <button id="join-btn">Join Chat</button>
    <div class="join-error" id="join-error"></div>
  </div>
</div>

<div id="chat-screen">
  <div class="conn-banner" id="conn-banner">Reconnecting&hellip;</div>
  <header class="chat-top">
    <span class="title">Quick Chat</span>
    <span class="presence-pill" id="presence-pill"><span class="dot"></span><span id="presence-count">0</span> online</span>
  </header>
  <div id="messages"></div>
  <form id="send-form">
    <input type="text" id="message-input" placeholder="Type a message&hellip;" maxlength="500" autocomplete="off">
    <button type="submit" id="send-btn">&#10148;</button>
  </form>
</div>

<script>
  const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';

  const joinScreen = document.getElementById('join-screen');
  const chatScreen = document.getElementById('chat-screen');
  const nicknameInput = document.getElementById('nickname-input');
  const joinBtn = document.getElementById('join-btn');
  const joinError = document.getElementById('join-error');
  const messagesEl = document.getElementById('messages');
  const sendForm = document.getElementById('send-form');
  const messageInput = document.getElementById('message-input');
  const presenceCount = document.getElementById('presence-count');
  const connBanner = document.getElementById('conn-banner');

  let ws = null;
  let myNickname = null;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatTime(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function renderMessage(msg) {
    const row = document.createElement('div');
    if (msg.system) {
      row.className = 'msg-row system';
      row.innerHTML = `<div class="msg-bubble">${escapeHtml(msg.text)}</div>`;
    } else {
      const isMe = msg.nickname === myNickname;
      row.className = 'msg-row' + (isMe ? ' me' : '');
      row.innerHTML = `
        ${isMe ? '' : `<div class="msg-nick">${escapeHtml(msg.nickname)}</div>`}
        <div class="msg-bubble">${escapeHtml(msg.text)}</div>
        <div class="msg-time">${formatTime(msg.timestamp)}</div>
      `;
    }
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function connect(nickname) {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      connBanner.style.display = 'none';
      ws.send(JSON.stringify({ type: 'join', nickname }));
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'history') {
        messagesEl.innerHTML = '';
        data.messages.forEach(renderMessage);
      } else if (data.type === 'message') {
        renderMessage(data);
      } else if (data.type === 'presence') {
        presenceCount.textContent = data.count;
      }
    };

    ws.onclose = () => {
      connBanner.style.display = 'block';
      setTimeout(() => connect(nickname), 2000);
    };

    ws.onerror = () => ws.close();
  }

  joinBtn.addEventListener('click', () => {
    const nickname = nicknameInput.value.trim();
    if (!nickname) {
      joinError.style.display = 'block';
      joinError.textContent = 'Please enter a name.';
      return;
    }
    myNickname = nickname;
    joinScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    connect(nickname);
  });

  nicknameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') joinBtn.click();
  });

  sendForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'chat', text }));
    messageInput.value = '';
  });
</script>

</body>
</html>
